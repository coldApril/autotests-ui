name: UI tests

on:
  push:
    branches:
      - main 
  pull_request:
    branches:
      - main 

jobs:
  run-tests:
    runs-on: ubuntu-latest  

    steps:
      - name: Check out repository
        uses: actions/checkout@v4  

      - name: Set up Python
        uses: actions/setup-python@v4  
        with:
          python-version: '3.12.2' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install -r requirements.txt 
          playwright install --with-deps

      # 4. Шаг для запуска тестов с использованием pytest и генерации отчётов Allure
      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2  # Запуск тестов, отмеченных как "regression", + генерация Allure отчёта

      # 5. Шаг для получения истории отчётов Allure, если она существует
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always() 
        continue-on-error: true 
        with:
          ref: gh-pages
          path: gh-pages

      # 6. Шаг для генерации и отображения отчёта Allure
      - name: Generates Allure Report with history
        uses: simple-elf/allure-report-action@v1.7
        if: always()  
        with:
          allure_results: allure-results
          allure_history: allure-history

      # 7. Шаг для деплоя отчёта Allure на GitHub Pages, чтобы его можно было просматривать в браузере
      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages # отчёт будет опубликован в ветке gh-pages
          publish_dir: ./allure-history # папка, которая будет опубликована на GitHub Pages